<app-open-layout>
  <p-toast />

  <app-open-confirm-delete
    [visible]="deleteTaskDialogVisible()"
    [message]="'dialogs.deleteTask' | translate"
    (confirmed)="onDeleteTaskConfirmed()"
    (cancelled)="onDeleteTaskCancelled()"
  />

  <app-open-confirm-delete
    [visible]="deleteTagDialogVisible()"
    [message]="'dialogs.deleteTag' | translate"
    (confirmed)="onDeleteTagConfirmed()"
    (cancelled)="onDeleteTagCancelled()"
  />

  <ng-template pTemplate="header">
    <header class="tasks-header">
      <h2 class="tasks-header__title">{{ "tasks.title" | translate }}</h2>
      <div class="tasks-header__actions">
        <p-select
          [options]="projects()"
          [(ngModel)]="selectedProjectFilter"
          [placeholder]="'tasks.filterByProject' | translate"
          optionLabel="name"
          optionValue="id"
          [showClear]="true"
          class="tasks-header__filter"
        />
        <p-button
          [label]="'tasks.new' | translate"
          icon="pi pi-plus"
          (onClick)="openNewDialog()"
        />
      </div>
    </header>
  </ng-template>

  <h3 class="tasks-section-title">{{ "tasks.pending" | translate }}</h3>
  <app-task-table
    [tasks]="filteredPendingTasks()"
    [loading]="loading()"
    [emptyMessage]="'tasks.emptyPending'"
    (editTask)="openEditDialog($event)"
    (deleteTask)="confirmDeleteTask($event)"
  />

  <h3 class="tasks-section-title tasks-section-title--completed">
    {{ "tasks.completed" | translate }}
  </h3>
  <app-task-table
    [tasks]="filteredCompletedTasks()"
    [loading]="loading()"
    [emptyMessage]="'tasks.emptyCompleted'"
    (editTask)="openEditDialog($event)"
    (deleteTask)="confirmDeleteTask($event)"
  />

  <p-dialog
    [header]="'tasks.dialog.title' | translate"
    [(visible)]="dialogVisible"
    [modal]="true"
    [style]="{ width: '600px' }"
  >
    <div class="task-form">
      <div class="task-form__field">
        <label for="taskName" class="task-form__label">{{
          "tasks.dialog.namePlaceholder" | translate
        }}</label>
        <input
          id="taskName"
          type="text"
          pInputText
          [(ngModel)]="taskForm.name"
          class="task-form__input"
        />
      </div>

      <div class="task-form__field">
        <label for="taskProject" class="task-form__label">{{
          "tasks.dialog.projectPlaceholder" | translate
        }}</label>
        <p-select
          id="taskProject"
          [options]="projects()"
          [(ngModel)]="taskForm.projectId"
          optionLabel="name"
          optionValue="id"
          [placeholder]="'tasks.dialog.selectProject' | translate"
          class="task-form__select"
        />
      </div>

      <div class="task-form__field">
        <label for="taskStatus" class="task-form__label">{{
          "tasks.dialog.statusPlaceholder" | translate
        }}</label>
        <p-select
          id="taskStatus"
          [options]="statuses()"
          [(ngModel)]="taskForm.statusId"
          optionLabel="name"
          optionValue="id"
          [placeholder]="'tasks.dialog.selectStatus' | translate"
          [showClear]="true"
          class="task-form__select"
        />
      </div>

      <div class="task-form__field">
        <label for="taskHours" class="task-form__label">{{
          "tasks.dialog.estimatedHoursPlaceholder" | translate
        }}</label>
        <p-inputNumber
          id="taskHours"
          [(ngModel)]="taskForm.estimatedHours"
          [min]="0"
          [max]="1000"
          [step]="0.5"
          mode="decimal"
          [minFractionDigits]="0"
          [maxFractionDigits]="1"
          class="task-form__input-number"
        />
      </div>

      <div class="task-form__field task-form__field--full">
        <label for="taskTags" class="task-form__label">{{
          "tasks.dialog.tagsPlaceholder" | translate
        }}</label>
        <p-multiSelect
          id="taskTags"
          [options]="tags()"
          [(ngModel)]="taskForm.tags"
          optionLabel="name"
          [placeholder]="'tasks.dialog.selectTags' | translate"
          class="task-form__multiselect"
          display="chip"
          appendTo="body"
        >
          <ng-template let-tag #item>
            <span class="tag-option">
              <span class="tag-option__name">{{ tag.name }}</span>
              <p-button
                icon="pi pi-trash"
                [rounded]="true"
                [text]="true"
                severity="danger"
                size="small"
                (onClick)="confirmDeleteTag($event, tag)"
                [pTooltip]="'common.delete' | translate"
                class="tag-option__delete"
              />
            </span>
          </ng-template>
          <ng-template #footer>
            <p-inputGroup class="tag-create">
              <input
                type="text"
                pInputText
                [ngModel]="newTagName()"
                (ngModelChange)="newTagName.set($event)"
                [ngModelOptions]="{ standalone: true }"
                [placeholder]="'tasks.dialog.newTagPlaceholder' | translate"
                class="tag-create__input"
                (keyup.enter)="createTag()"
              />
              <p-button
                icon="pi pi-plus"
                severity="success"
                (onClick)="createTag()"
                [disabled]="!newTagName().trim()"
              />
            </p-inputGroup>
          </ng-template>
        </p-multiSelect>
      </div>

      <div class="task-form__field task-form__field--full">
        <label for="taskDescription" class="task-form__label">{{
          "tasks.dialog.descriptionPlaceholder" | translate
        }}</label>
        <textarea
          id="taskDescription"
          pTextarea
          [(ngModel)]="taskForm.description"
          rows="3"
          class="task-form__textarea"
        ></textarea>
      </div>
    </div>

    <ng-template pTemplate="footer">
      <p-button
        [label]="'common.cancel' | translate"
        severity="secondary"
        (onClick)="dialogVisible.set(false)"
      />
      <p-button
        [label]="'common.save' | translate"
        [disabled]="!taskForm.name || !taskForm.projectId"
        (onClick)="saveTask()"
      />
    </ng-template>
  </p-dialog>
</app-open-layout>
