<article class="task-card">
  <p-card>
    <span class="task-card__project">{{
      task().project?.name || ("home.noProject" | translate)
    }}</span>
    <h2 class="task-card__name">{{ task().name }}</h2>
    @if (task().description) {
      <p class="task-card__description">{{ task().description }}</p>
    }
    <div class="task-card__footer">
      <div class="task-card__meta">
        @if (task().status) {
          <p-tag
            [value]="getStatusDisplayName(task().status!.name)"
            [severity]="getStatusSeverity(task().status!.name)"
          />
        }
        @if (task().estimatedHours) {
          <span class="task-card__hours">{{ task().estimatedHours }}h</span>
        }
        @for (taskTag of task().tags; track taskTag.tag.id) {
          <p-chip [label]="taskTag.tag.name" />
        }
      </div>
    </div>
  </p-card>
</article>
