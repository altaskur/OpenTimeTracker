<div class="container">
  <p-card class="welcome-card">
    <h1>OpenTimeTracker</h1>
    <p>Sistema de seguimiento de tiempo para proyectos y tareas</p>

    <div class="navigation">
      <p-button
        label="Dashboard"
        icon="pi pi-chart-line"
        severity="primary"
        (click)="goToDashboard()">
      </p-button>

      <p-button
        label="Proyectos"
        icon="pi pi-folder"
        severity="secondary"
        (click)="goToProjects()">
      </p-button>

      <p-button
        label="Alternar Tema"
        icon="pi pi-moon"
        severity="help"
        (click)="toggleDarkMode()">
      </p-button>
    </div>
  </p-card>
</div>
