<app-open-layout>
  <p-toast />
  <ng-template pTemplate="header">
    <header class="projects-header">
      <h2 class="projects-header__title">
        {{ "projects.title" | translate }}
      </h2>
      <div class="projects-header__actions">
        <p-iconfield class="projects-header__search">
          <p-inputicon styleClass="pi pi-search" />
          <input
            type="text"
            pInputText
            [ngModel]="searchTerm()"
            (ngModelChange)="searchTerm.set($event)"
            [placeholder]="'projects.search' | translate"
          />
        </p-iconfield>
        <p-button
          [label]="'projects.new' | translate"
          icon="pi pi-plus"
          (onClick)="openNewDialog()"
        />
      </div>
    </header>
  </ng-template>

  <h3 class="projects-section-title">{{ "projects.open" | translate }}</h3>
  <app-project-table
    [projects]="filteredOpenProjects()"
    [loading]="loading()"
    [emptyMessage]="'projects.emptyOpen'"
    [showClosed]="false"
    (editProject)="openEditDialog($event)"
    (deleteProject)="confirmDeleteProject($event)"
    (closeProject)="closeProject($event)"
  />

  <h3 class="projects-section-title projects-section-title--closed">
    {{ "projects.closed" | translate }}
  </h3>
  <app-project-table
    [projects]="filteredClosedProjects()"
    [loading]="loading()"
    [emptyMessage]="'projects.emptyClosed'"
    [showClosed]="true"
    (editProject)="openEditDialog($event)"
    (deleteProject)="confirmDeleteProject($event)"
    (reopenProject)="reopenProject($event)"
  />

  <p-dialog
    [header]="'projects.dialog.title' | translate"
    [(visible)]="dialogVisible"
    [modal]="true"
    [style]="{ width: '500px' }"
  >
    <div class="project-form">
      <div class="project-form__field">
        <label for="projectName" class="project-form__label">{{
          "projects.dialog.namePlaceholder" | translate
        }}</label>
        <input
          id="projectName"
          type="text"
          pInputText
          [(ngModel)]="projectForm.name"
          class="project-form__input"
        />
      </div>

      <div class="project-form__field">
        <label for="projectDescription" class="project-form__label">{{
          "projects.dialog.descriptionPlaceholder" | translate
        }}</label>
        <textarea
          id="projectDescription"
          pTextarea
          [(ngModel)]="projectForm.description"
          rows="4"
          class="project-form__textarea"
        ></textarea>
      </div>
    </div>

    <ng-template pTemplate="footer">
      <p-button
        [label]="'common.cancel' | translate"
        severity="secondary"
        (onClick)="dialogVisible.set(false)"
      />
      <p-button
        [label]="'common.save' | translate"
        [disabled]="!projectForm.name"
        (onClick)="saveProject()"
      />
    </ng-template>
  </p-dialog>

  <app-open-confirm-delete
    [visible]="deleteDialogVisible()"
    [message]="'dialogs.deleteProject' | translate"
    (confirmed)="onDeleteConfirmed()"
    (cancelled)="onDeleteCancelled()"
  />
</app-open-layout>
