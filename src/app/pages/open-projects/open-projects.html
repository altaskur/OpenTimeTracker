<app-open-layout>
  <p-card>
    <ng-template pTemplate="header">
      <div class="header-content">
        <h2>{{ "projects.title" | translate }}</h2>
        <p-button
          [label]="'projects.new' | translate"
          icon="pi pi-plus"
          (click)="openNewDialog()"
          (keydown.enter)="openNewDialog()"
        >
        </p-button>
      </div>
    </ng-template>

    <p-table [value]="projects()" [loading]="loading()">
      <ng-template pTemplate="header">
        <tr>
          <th scope="col">{{ "table.name" | translate }}</th>
          <th scope="col">{{ "table.description" | translate }}</th>
          <th scope="col">{{ "table.createdAt" | translate }}</th>
          <th scope="col" style="width: 150px">
            {{ "table.actions" | translate }}
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-project>
        <tr>
          <td>{{ project.name }}</td>
          <td>{{ project.description }}</td>
          <td>{{ project.created_at }}</td>
          <td>
            <p-button
              icon="pi pi-pencil"
              [text]="true"
              severity="secondary"
              (click)="openEditDialog(project)"
              (keydown.enter)="openEditDialog(project)"
            >
            </p-button>
            <p-button
              icon="pi pi-trash"
              [text]="true"
              severity="danger"
              (click)="deleteProject(project.id)"
              (keydown.enter)="deleteProject(project.id)"
            >
            </p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>

  <p-dialog
    [header]="'projects.dialog.title' | translate"
    [(visible)]="dialogVisible"
    [modal]="true"
    [style]="{ width: '500px' }"
  >
    <div class="field">
      <label for="name">{{
        "projects.dialog.namePlaceholder" | translate
      }}</label>
      <input
        id="name"
        type="text"
        pInputText
        [(ngModel)]="projectForm.name"
        class="w-full"
      />
    </div>

    <div class="field">
      <label for="description">{{
        "projects.dialog.descriptionPlaceholder" | translate
      }}</label>
      <textarea
        id="description"
        pInputText
        [(ngModel)]="projectForm.description"
        rows="4"
        class="w-full"
      ></textarea>
    </div>

    <ng-template pTemplate="footer">
      <p-button
        [label]="'common.cancel' | translate"
        severity="secondary"
        (click)="dialogVisible.set(false)"
        (keydown.enter)="dialogVisible.set(false)"
      >
      </p-button>
      <p-button
        [label]="'common.save' | translate"
        (click)="saveProject()"
        (keydown.enter)="saveProject()"
      >
      </p-button>
    </ng-template>
  </p-dialog>
</app-open-layout>
