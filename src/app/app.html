<!-- Global Update Dialog -->
<app-open-update-dialog
  [visible]="updateDialogVisible()"
  [updateInfo]="updateService.updateAvailable()"
  [downloadProgress]="updateService.downloadProgress()"
  [isDownloading]="updateService.isDownloading()"
  [isDownloaded]="updateService.updateDownloaded()"
  (download)="onDownloadUpdate()"
  (install)="onInstallUpdate()"
  (closed)="onCloseUpdateDialog()"
/>
